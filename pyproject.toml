[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trovis-proxy"
version = "1.1.1"
description = "Generic TROVIS Modbus Proxy and controller research tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = [
  "trovis",
  "trovis-view",
  "samson",
  "modbus",
  "modbus-tcp",
  "rtu-over-tcp",
  "heating-control",
  "building-automation",
]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
live = [
  "modbus-connection[tmodbus]>=4.10.1,<5",
]
serial = [
  "pyserial>=3.5,<4",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
trovisctl = "trovis_manager.cli:main"
trovis-gateway = "trovis_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trovis_manager", "src/trovis_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"reference/fw309-register-matrix.json" = "trovis_manager/data/fw309-register-matrix.json"
"reference/fw309_anlage21.json" = "trovis_manager/data/fw309_anlage21.json"
"reference/golden-comparison-map.json" = "trovis_manager/data/golden-comparison-map.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
