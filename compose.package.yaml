name: trovis-proxy

services:
  gateway:
    image: ghcr.io/macsobeck/trovis-proxy:1.1.0
    restart: unless-stopped
    ports:
      - "7112:7112"
      - "8083:8080"
    environment:
      LISTEN_ADDRESS: 0.0.0.0
      LISTEN_PORT: 7112
      ADMIN_ADDRESS: 0.0.0.0
      ADMIN_PORT: 8080
      GATEWAY_CONFIG_PATH: /data/config.json
      MODBUS_TRACE: "1"
    volumes:
      - ./data:/data
