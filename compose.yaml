name: trovis-proxy

services:
  gateway:
    image: trovis-proxy:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7112:7112"
      - "127.0.0.1:8080:8080"
    environment:
      LISTEN_ADDRESS: 0.0.0.0
      LISTEN_PORT: 7112
      ADMIN_ADDRESS: 0.0.0.0
      ADMIN_PORT: 8080
      GATEWAY_CONFIG_PATH: /data/config.json
      MODBUS_TRACE: "0"
    volumes:
      - gateway-data:/data

volumes:
  gateway-data:
